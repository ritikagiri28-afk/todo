<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <style>
        body {
            max-width: 600px;
            margin: 3rem auto;
            padding: 0 1rem;
            font-family: Arial, sans-serif;
        }

        form {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.6rem;
        }

        button {
            padding: 0.6rem 1rem;
            cursor: pointer;
        }

        #todo-list {
            padding: 0;
            list-style: none;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.75rem 0;
        }

        #todo-list label {
            flex: 1;
        }

        #todo-list input:checked + label {
            color: #666;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <main>
        <h1>To-Do List</h1>
        <form id="todo-form">
            <label for="todo-input">New task</label>
            <input id="todo-input" type="text" placeholder="What needs to be done?" required>
            <button type="submit">Add task</button>
        </form>
        <ul id="todo-list" aria-label="Tasks"></ul>
        <p id="empty-message">No tasks yet. Add one above.</p>
    </main>

    <script>
        const form = document.querySelector("#todo-form");
        const input = document.querySelector("#todo-input");
        const list = document.querySelector("#todo-list");
        const emptyMessage = document.querySelector("#empty-message");
        let nextTaskId = 0;

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const task = input.value.trim();
            if (!task) return;

            const item = document.createElement("li");
            const checkbox = document.createElement("input");
            const label = document.createElement("label");
            const removeButton = document.createElement("button");

            checkbox.type = "checkbox";
            checkbox.id = `todo-${nextTaskId++}`;
            label.textContent = task;
            label.htmlFor = checkbox.id;
            removeButton.type = "button";
            removeButton.textContent = "Remove";
            removeButton.setAttribute("aria-label", `Remove task: ${task}`);
            removeButton.addEventListener("click", () => {
                item.remove();
                emptyMessage.hidden = list.children.length > 0;
            });

            item.append(checkbox, label, removeButton);
            list.append(item);
            input.value = "";
            emptyMessage.hidden = true;
            input.focus();
        });
    </script>
</body>
</html>
